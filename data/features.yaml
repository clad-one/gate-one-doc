- slug: delegated-credentials
  title: Call services with the user's credentials
  linkTitle: Delegated credentials
  weight: 56
  usefulIf: a route or an MCP tool must call an external service as the signed-in user.
  summary: The token broker stores a per-user token; upstream.delegated injects it into API and MCP requests, and the user badge links to the connections page.
  example: /docs/examples/mcp-tools/
  configRefs:
    - label: tokenBroker
      url: /docs/config/gate-one/#field-tokenBroker
