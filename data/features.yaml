- slug: sso-multi-apps
  title: SSO across your apps
  linkTitle: SSO across apps
  weight: 10
  usefulIf: you want one login for several applications without changing the applications.
  summary: One authentication provider, one login host and a shared cookie domain across applications.
  example: /docs/examples/multi-app-sso/
  configRefs:
    - label: issuer
      url: /docs/config/gate-one/#field-authProvider-issuer
    - label: cookieDomain
      url: /docs/config/gate-one/#field-authProvider-cookieDomain
  plugin: false
- slug: multiple-idps
  title: Multiple identity providers
  linkTitle: Multiple identity providers
  weight: 20
  usefulIf: your users come from several identity providers and you already run an IAM.
  summary: Use Keycloak, Zitadel or another OIDC IAM to federate Google and other IdPs behind one issuer.
  example: /docs/examples/keycloak-google/
  configRefs:
    - label: issuer
      url: /docs/config/gate-one/#field-authProvider-issuer
    - label: clientId
      url: /docs/config/gate-one/#field-authProvider-clientId
    - label: roleClaims
      url: /docs/config/gate-one/#field-authProvider-roleClaims
  plugin: false
- slug: embedded-iam
  title: Embedded IAM
  linkTitle: Embedded IAM
  weight: 30
  usefulIf: you want IdP federation and managed user grants without running an external IAM.
  summary: The lightweight cladone-auth broker maps IdP claims to a common roles/scopes/claims model and manages local and federated users.
  example: /docs/examples/embedded-iam/
  configRefs:
    - label: broker tenants
      url: /docs/config/broker/#field-tenants
    - label: claim mappings
      url: /docs/config/broker/#field-tenants-mappings
    - label: authProviders
      url: /docs/config/gate-one/#field-authProviders
  plugin: false
- slug: horizontal-scaling
  title: Horizontal scaling
  linkTitle: Horizontal scaling
  weight: 40
  usefulIf: you need several Gate One replicas behind a load balancer.
  summary: Shared Redis session/revocation state and a common signing key make logout and revocation effective across replicas.
  example: /docs/examples/high-availability/
  configRefs:
    - label: sessionStore
      url: /docs/config/gate-one/#field-authProvider-sessionStore
    - label: sessionKeyEnv
      url: /docs/config/gate-one/#field-authProvider-sessionKeyEnv
  plugin: false
- slug: protect-api-mcp
  title: Protect APIs and MCP tools
  linkTitle: APIs and MCP
  weight: 50
  usefulIf: you expose APIs or MCP tools to authenticated users and machine clients.
