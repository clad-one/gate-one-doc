  plugin: false
- slug: mcp-tools
  title: Expose REST APIs and MCP servers as MCP tools
  linkTitle: MCP tools
  weight: 55
  usefulIf: you want MCP clients to reach services that do not speak MCP.
  summary: Derive tools from an OpenAPI document, proxy an existing MCP server, and aggregate several services under one endpoint with its own audience, scope and identity.
